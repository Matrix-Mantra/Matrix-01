<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7F1">
  <meta name="description" content="Find hospitals in Nepal, read people's reviews, and get a simple guide for where to go by speaking in Nepali.">
  <title>Matrix</title>
  <link rel="preload" href="/static/fonts/Mukta-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span id="brandName">Matrix</span>
    </a>
    <div class="top-actions">
      <button class="link-btn" id="langBtn" type="button">English</button>
      <button class="pill-btn" id="loginBtn" type="button">लगइन</button>
      <button class="avatar" id="avatarBtn" type="button" hidden aria-haspopup="dialog"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Login -->
  <dialog id="loginSheet" class="sheet" aria-labelledby="loginTitle">
    <form method="dialog" class="sheet-body" id="loginForm">
      <h2 id="loginTitle"></h2>
      <p class="muted" id="loginWhy"></p>
      <button class="google-btn" id="googleBtn" type="button" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="googleLabel"></span>
      </button>
      <div id="devLogin" hidden>
        <label class="field-label" for="devName" id="devNameLabel"></label>
        <input class="input" id="devName" maxlength="40" autocomplete="name">
        <label class="field-label" for="devEmail" id="devEmailLabel"></label>
        <input class="input" id="devEmail" type="email" maxlength="254" autocomplete="email" inputmode="email">
        <button class="primary-btn wide" id="devGo" type="button"></button>
        <p class="muted small" id="devNote"></p>
      </div>
      <p class="error" id="loginError" hidden></p>
      <button class="text-btn" value="cancel" id="loginCancel"></button>
    </form>
  </dialog>

  <!-- Account -->
  <dialog id="accountSheet" class="sheet" aria-labelledby="accountName">
    <form method="dialog" class="sheet-body">
      <h2 id="accountName"></h2>
      <label class="field-label" for="accountEmail" id="accountEmailLabel"></label>
      <input class="input" id="accountEmail" type="email" maxlength="254" autocomplete="email" inputmode="email">
      <p class="muted small" id="accountNote"></p>
      <button class="primary-btn wide" id="accountSave" type="button"></button>
      <button class="secondary-btn wide" id="logoutBtn" type="button"></button>
      <button class="text-btn" value="cancel" id="accountClose"></button>
    </form>
  </dialog>

  <!-- Location -->
  <dialog id="placeSheet" class="sheet" aria-labelledby="placeTitle">
    <form method="dialog" class="sheet-body">
      <h2 id="placeTitle"></h2>
      <button class="primary-btn wide" id="gpsBtn" type="button"></button>
      <label class="field-label" for="districtSel" id="districtLabel"></label>
      <select class="input" id="districtSel"></select>
      <div class="row-end">
        <button class="text-btn" value="cancel" id="placeCancel"></button>
        <button class="secondary-btn" id="placeSave" type="button"></button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
